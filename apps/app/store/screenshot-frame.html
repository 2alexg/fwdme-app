<!doctype html>
<!-- Google Play phone screenshot (1080 x 1920): caption above a framed screenshot.
     Rendered by scripts/frame-screenshots.mjs: ?lang=en|he&shot=<path>&title=…&sub=… -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 70% 30%, #1d6b3c 0%, #14532d 55%, #0f3f22 100%);
    font-family: "Noto Sans Hebrew", "Noto Sans", "DejaVu Sans", sans-serif;
    color: #fff; display: flex; flex-direction: column; align-items: center;
    padding-top: 120px; box-sizing: border-box; text-align: center;
  }
  h1 { font-size: 84px; margin: 0 72px; letter-spacing: -1.5px; font-weight: 800; line-height: 1.1; }
  p { font-size: 42px; margin: 24px 90px 0; color: #6ee7b7; font-weight: 600; line-height: 1.3; }
  .phone {
    margin-top: 72px; padding: 16px; border-radius: 72px; background: #08130c;
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.45), inset 0 0 0 3px #1f3a29;
  }
  /* Fills 860 x 1360 at most, keeping its shape, whatever the phone's resolution. */
  .phone img { display: block; border-radius: 58px; }
</style>
</head>
<body>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div class="phone"><img id="shot" alt=""></div>
<script>
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') === 'he' ? 'he' : 'en';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
  document.getElementById('title').textContent = q.get('title') ?? '';
  document.getElementById('sub').textContent = q.get('sub') ?? '';
  const shot = document.getElementById('shot');
  shot.onload = () => {
    const scale = Math.min(860 / shot.naturalWidth, 1360 / shot.naturalHeight);
    shot.width = Math.round(shot.naturalWidth * scale);
    shot.height = Math.round(shot.naturalHeight * scale);
    document.body.dataset.ready = '1';
  };
  shot.src = q.get('shot');
</script>
</body>
</html>
