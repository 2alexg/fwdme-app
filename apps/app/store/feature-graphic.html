<!doctype html>
<!-- Google Play feature graphic (1024 x 500). Rendered by scripts/make-store-graphics.mjs:
     ?lang=en or ?lang=he. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 78% 40%, #1d6b3c 0%, #14532d 55%, #0f3f22 100%);
    font-family: "Noto Sans Hebrew", "Noto Sans", "DejaVu Sans", sans-serif;
    color: #fff; display: flex; align-items: center; gap: 56px; padding: 0 84px; box-sizing: border-box;
  }
  img { width: 230px; height: 230px; object-fit: contain; flex: none; }
  h1 { font-size: 88px; margin: 0; letter-spacing: -2px; font-weight: 800; }
  p { font-size: 38px; margin: 14px 0 0; color: #6ee7b7; font-weight: 600; line-height: 1.25; }
</style>
</head>
<body>
  <img src="../assets/splash-icon.png" alt="">
  <div>
    <h1 dir="ltr">Fwd:Me</h1>
    <p id="tag"></p>
  </div>
<script>
  const lang = new URLSearchParams(location.search).get('lang') === 'he' ? 'he' : 'en';
  const tag = { en: 'Your links, organized for you', he: 'הקישורים שלך, מסודרים' };
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
  document.getElementById('tag').textContent = tag[lang];
</script>
</body>
</html>
